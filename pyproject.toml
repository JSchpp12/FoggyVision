[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "FoggyVision"
version = "0.3.0"
description = "Suite of machine learning approaches to estimate atmospheric visibility"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Jacob Schaupp", email = "jacob.schaupp@gmail.com"}
]
keywords = ["fog", "visibility", "computer-vision", "dataset", "sqlite"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "foggy_vision_loader>=0.4.0",
  "torch",
  "Pillow",
  "matplotlib",
  "scipy",
  "opencv-python",
  "tqdm",
  "numpy",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/JSchpp12/FoggyVision"
Repository = "https://github.com/JSchpp12/FoggyVision"
Issues = "https://github.com/JSchpp12/FoggyVision/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/fogvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
